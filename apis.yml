name: Onsitedental
description: 'Onsite Dental is a mobile and on-site dental care provider that brings
  full-scope oral healthcare directly to employers and their employees at the workplace.
  It operates three delivery models: fixed-site practices built inside client buildings,
  mobile dental clinics deployed to larger corporate campuses, and pop-up practices
  set up temporarily in conference rooms or amenity centers. Services span cleanings,
  preventive and diagnostic care, and full treatment delivered by dentists, hygienists,
  and specialists, positioned as an employee benefit for large employers and their
  benefits consultants. Onsite Dental is a portfolio company of Norwest Venture Partners.
  As of this enrichment pass the company publishes no developer API, developer portal,
  documentation, or machine-readable API surface.'
